<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Industrial Program Viewer</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Industrial Program — Viewer</h1><p id="notice"></p><section id="login"><h2>Sign in</h2><form id="loginForm"><input id="email" type="email" placeholder="Email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form></section><section id="dashboard" hidden><button id="logout">Sign out</button><h2>Program library</h2><input id="search" placeholder="Search series, model, version, comments"><select id="kindFilter"><option value="">All types</option><option>HMI</option><option>PLC</option></select><button id="reloadReleases">Refresh</button><div id="releases"></div></section></main><script src="app.js"></script></body></html>
